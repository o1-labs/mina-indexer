# Reference reverse-proxy config for a PUBLIC mina-indexer deployment.
#
# The indexer serves plain HTTP on :8080 and is designed to sit behind a proxy
# that terminates TLS and enforces auth + edge rate limiting. This is a starting
# point — review every value before production use. See ops/reverse-proxy/README.md.
#
# What this adds on top of the indexer's own guards (all optional, see the
# `--web-*` / `--graphql-*` flags): TLS termination, an auth gate, edge rate
# limiting keyed on the real client IP, and a request-body cap.

# --- rate limiting (edge) -------------------------------------------------
# Keyed on the real client IP. Tune to your traffic; this is a conservative
# default of ~20 req/s sustained per IP with a burst of 40.
limit_req_zone $binary_remote_addr zone=indexer_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=indexer_conn:10m;

upstream mina_indexer {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name indexer.example.com;   # <-- change

    # --- TLS ---------------------------------------------------------------
    # Point these at your certs (e.g. from certbot / Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/indexer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indexer.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # --- limits ------------------------------------------------------------
    limit_req  zone=indexer_rl burst=40 nodelay;
    limit_conn indexer_conn 20;
    client_max_body_size 1m;          # mirror --web-max-body-bytes
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # --- security headers --------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # --- auth --------------------------------------------------------------
    # OPTION A — HTTP Basic auth (create the file with `htpasswd`):
    #   auth_basic "mina-indexer";
    #   auth_basic_user_file /etc/nginx/indexer.htpasswd;
    #
    # OPTION B — static bearer token (simple API-key gate). Uncomment and set:
    #   if ($http_authorization != "Bearer CHANGE_ME_LONG_RANDOM_TOKEN") {
    #       return 401;
    #   }
    #
    # For real multi-tenant auth (per-key quotas, revocation) use an auth
    # subrequest (auth_request) to your own service, or an API gateway.

    location / {
        proxy_pass http://mina_indexer;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Never expose Prometheus metrics publicly — scrape them privately.
    location = /metrics { deny all; }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name indexer.example.com;   # <-- change
    return 301 https://$host$request_uri;
}
