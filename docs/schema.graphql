type Root {
	block(query: BlockQueryInput): Block
	blocks(query: BlockQueryInput, limit: Int! = 100, sortBy: BlockSortByInput, offset: Int! = 0): [Block!]!
	"""
	Total blocks matching `query` -- the count companion to `blocks`, for a
	gateway to compute total pages. Runs the same dispatch (same filters),
	uncapped and unpaged, and counts the result so the count can never
	disagree with the list.
	"""
	blocksCount(query: BlockQueryInput, sortBy: BlockSortByInput): Int!
	actions(query: ActionsQueryInput!, sortBy: ActionsSortByInput, limit: Int! = 100, offset: Int! = 0): [Action!]
	"""
	Total actions matching `query` -- the count companion to `actions`. Applies
	the same `matches` filter over the same iterator, without building each
	`Action` (which does per-action block/command lookups), so it stays cheap.
	"""
	actionsCount(query: ActionsQueryInput!): Int!
	events(query: EventsQueryInput!, sortBy: EventsSortByInput, limit: Int! = 100, offset: Int! = 0): [Event!]
	"""
	Total events matching `query` -- the count companion to `events`, for a
	gateway to compute total pages. Applies the same `matches` filter over the
	same iterator, but does not build each `Event` (which does per-event
	block/command lookups), so it stays cheap.
	"""
	eventsCount(query: EventsQueryInput!): Int!
	stakes(query: StakesQueryInput, sortBy: StakesSortByInput, limit: Int! = 100, offset: Int! = 0): [StakesLedgerAccountWithMeta!]!
	"""
	Total staking accounts matching `query` in the epoch's ledger -- the count
	companion to `stakes`. Applies the same two filters (`matches_staking_account`
	then the `stake_lte` bound on total delegated) without building each
	`StakesLedgerAccountWithMeta`, so it stays cheap.
	"""
	stakesCount(query: StakesQueryInput): Int!
	accounts(query: AccountQueryInput, sortBy: AccountSortByInput, limit: Int! = 100, offset: Int! = 0): [AccountWithMeta!]!
	"""
	Total number of accounts matching `query` -- the count companion to
	`accounts`, for a gateway to compute total pages. Uses the same filter
	as `accounts` (shared `account_matches`) so the two can never
	disagree.
	"""
	accountsCount(query: AccountQueryInput): Int!
	transaction(query: TransactionQueryInput!): Transaction
	transactions(query: TransactionQueryInput, limit: Int! = 100, sortBy: TransactionSortByInput, offset: Int! = 0): [Transaction!]!
	"""
	Total transactions matching `query` -- the count companion to
	`transactions`, for total-page math. Runs the same dispatch (same
	filters), uncapped and unpaged, and counts the result so the count
	can never disagree with the list.
	"""
	transactionsCount(query: TransactionQueryInput, sortBy: TransactionSortByInput): Int!
	internalCommands(query: InternalCommandQueryInput, sortBy: InternalCommandSortByInput, limit: Int! = 100, offset: Int! = 0): [InternalCommandWithMeta!]!
	"""
	Total internal commands matching `query` -- the count companion to
	`internalCommands`, for total-page math. Runs the same dispatch (same
	filters), uncapped and unpaged, and counts the result so the count can
	never disagree with the list.
	"""
	internalCommandsCount(query: InternalCommandQueryInput, sortBy: InternalCommandSortByInput): Int!
	snarks(query: SnarkQueryInput, sortBy: SnarkSortByInput, limit: Int! = 100, offset: Int! = 0): [SnarkWithCanonicity!]!
	"""
	Total snarks matching `query` -- the count companion to `snarks`, for a
	gateway to compute total pages. Runs the same dispatch (same filters),
	uncapped and unpaged, and counts the result so the count can never
	disagree with the list.
	"""
	snarksCount(query: SnarkQueryInput, sortBy: SnarkSortByInput): Int!
	stagedLedgerAccounts(query: StagedLedgerQueryInput, sortBy: StagedLedgerSortByInput, limit: Int! = 100, offset: Int! = 0): [StagedLedgerAccount!]
	tokens(query: TokensQueryInput, sortBy: TokensSortByInput, limit: Int! = 100, offset: Int! = 0): [Token!]!
	"""
	Total tokens matching `query` -- the count companion to `tokens`, for a
	gateway to compute total pages. Applies the same `matches` filter over
	the same iterator without building each `Token`, so it stays cheap.
	"""
	tokensCount(query: TokensQueryInput): Int!
	tokenHolders(query: TokenHoldersQueryInput, sortBy: TokenHoldersSortByInput, limit: Int! = 100, offset: Int! = 0): [TokenHolder!]!
	"""
	Total token holders matching `query` -- the count companion to
	`tokenHolders`. Applies the same `matches` filter over the same iterator
	(by token, or by holder) without building each `TokenHolder`, so it
	stays cheap.
	"""
	tokenHoldersCount(query: TokenHoldersQueryInput): Int!
	topStakers(query: TopStakersQueryInput, sortBy: TopStakersSortByInput, limit: Int! = 100, offset: Int! = 0): [TopStakerAccount!]!
	"""
	Total stakers matching `query` in the epoch -- the count companion to
	`topStakers`, for a gateway to compute total pages. Counts the same rows
	`topStakers` would return (same epoch region + `matches` filter), but
	without building each `TopStakerAccount`, so it stays cheap.
	"""
	topStakersCount(query: TopStakersQueryInput): Int!
	topSnarkers(query: TopSnarkersQueryInput, sortBy: TopSnarkersSortByInput, limit: Int! = 100, offset: Int! = 0): [TopSnarker!]!
	"""
	Total snarkers matching `query` in the epoch -- the count companion to
	`topSnarkers`. Counts the same epoch-region rows (with the same pk/username
	filter) without building each `TopSnarker`, so it stays cheap.
	"""
	topSnarkersCount(query: TopSnarkersQueryInput): Int!
	"""
	Locked/vesting supply rolled up by `bucket` (all-time / year / month /
	day), oldest first. Backs Blockberry's
	`getTimeLocks{All,Day,Month,Year}`.
	"""
	timeLocks(bucket: TimeLockBucket!): [TimeLockEntry!]!
	"""
	User-transaction count per `bucket` over the canonical chain, oldest
	first. Backs Blockberry's `getTransactionsCountChart`.
	
	With `address`, counts only transactions that public key is a party to
	(sent or received); without it, the network-wide total.
	"""
	transactionsCountChart(bucket: ChartBucket!, address: String): [ChartPoint!]!
	"""
	zkApp-command count per `bucket` over the canonical chain, oldest first.
	Backs Blockberry's `getZkAppTransactionsCountChart`. Network-wide only
	-- the store has no per-address zkApp-command index to filter on.
	"""
	zkappTransactionsCountChart(bucket: ChartBucket!): [ChartPoint!]!
	"""
	Stake delegated to `address` per staking epoch, oldest first. Backs
	Blockberry's `getDelegationAmountChart`.
	
	One point per epoch that has a staking ledger delegating to `address`;
	`date` is the epoch's start (for a time axis). Cheap -- staking ledgers
	are per-epoch and few (~one lookup per epoch), so it is not scanned like
	the block-count charts.
	"""
	delegationAmountChart(address: String!): [DelegationPoint!]!
	"""
	A zkApp account's verification-key change history, newest first,
	canonical only. Backs Blockberry's `getVerificationKeyHistory`.
	"""
	verificationKeyHistory(address: String!, limit: Int! = 100, offset: Int! = 0): [VerificationKeyChangeEntry!]!
	"""
	The most recent canonical verification-key change for a zkApp account,
	or `null` if the key never changed. Backs
	`getLastVerificationKeyChange`.
	"""
	lastVerificationKeyChange(address: String!): VerificationKeyChangeEntry
	version: String!
	dbVersion: String!
}

