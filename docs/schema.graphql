	userCommands: [TransactionWithoutBlock!]!
	"""
	Value block zkApp commands. Archive-node-api compatible.
	"""
	zkappCommands: [ZkAppCommand!]!
}

type TxnInfo {
	"""
	Value txn status - applied/failed
	"""
	status: String!
	"""
	Value txn hash
	"""
	txnHash: String!
	"""
	Value txn memo
	"""
	memo: String!
}

type VerificationKey {
	data: String!
	hash: String!
}

type VerificationKeyChangeEntry {
	"""
	Block height the change was applied at.
	"""
	block_height: Int!
	"""
	State hash of that block.
	"""
	state_hash: String!
	"""
	Block timestamp.
	"""
	date_time: DateTime!
	"""
	Hash of the transaction that set the key.
	"""
	txn_hash: String!
	"""
	Token of the zkApp account.
	"""
	token: String!
	"""
	Hash of the previous verification key, or `null` when this is the first
	key set on the account (its creation).
	"""
	old_verification_key_hash: String
	"""
	The verification key set by this change (full key + hash).
	"""
	verification_key: VerificationKey!
}

"""
A single account update inside a zkApp command: whose balance moves, in which token, and
by how much. Updates nested under `calls` are flattened in, because the ledger applies
those too and a consumer reconstructing balances must see them.
"""
type ZkAppAccountUpdate {
	"""
	Public key of the account this update touches.
	"""
	publicKey: String!
	"""
	Token address the update applies to.
	"""
	token: String!
	"""
	Signed balance change in nanomina, as a string. Negative for a debit.
	"""
	balanceChange: String!
	"""
	Whether this update increments the account's nonce.
	"""
	incrementNonce: Boolean!
}

"""
Archive-node-api compatible zkApp command. The archive serves zkApp commands
under `BlockTransactions.zkappCommands`, separate from `userCommands`.
"""
type ZkAppCommand {
	hash: String!
	"""
	zkApp fee-payer public key.
	"""
	feePayer: String!
	"""
	Fee (nanomina) as a string.
	"""
	fee: String!
	"""
	Base58check-encoded memo.
	"""
	memo: String!
	"""
	"applied" | "failed".
	"""
	status: String!
	failureReason: String
	"""
	The command's account updates, in the order the ledger applies them. Without these a
	consumer sees only the fee and cannot reconstruct what the command did to balances.
	"""
	accountUpdates: [ZkAppAccountUpdate!]!
}

type ZkappAccount {
	appState: [String!]!
	actionState: [String!]!
	verificationKey: VerificationKey!
	provedState: Boolean!
	zkappUri: String!
	zkappVersion: Int!
	lastActionSlot: Int!
}

directive @deprecated(reason: String = "No longer supported") on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Root
}
