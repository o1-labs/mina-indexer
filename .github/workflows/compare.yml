# Daily consistency check: the deployed mina-indexer GraphQL API vs the
# canonical mina archive-node API, over the block range both serve.
#
# Runs the `#[ignore]`d `devnet_indexer_matches_archive` integration test
# (rust/tests/compare/), which fails on any block-identity / transaction-count /
# signed-command-content discrepancy. Transaction-hash mismatches are reported
# but non-fatal until the v2 hash bug is fixed; flip COMPARE_STRICT_TX_HASH=1
# here once it is.
#
# Scheduled only (no PR gating) plus manual dispatch. Builds via Nix, same as
# the OCI image workflow.
name: Endpoint comparison

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      indexer_url:
        description: Indexer GraphQL endpoint
        default: https://devnet-indexer.gcp.o1test.net/graphql
      archive_url:
        description: Archive-node GraphQL endpoint
        default: https://devnet-archive-node-api.gcp.o1test.net/
      strict_tx_hash:
        description: Fail on transaction-hash mismatches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Compare indexer vs archive node
        env:
          INDEXER_GQL_URL: ${{ github.event.inputs.indexer_url || 'https://devnet-indexer.gcp.o1test.net/graphql' }}
          ARCHIVE_GQL_URL: ${{ github.event.inputs.archive_url || 'https://devnet-archive-node-api.gcp.o1test.net/' }}
          COMPARE_STRICT_TX_HASH: ${{ github.event.inputs.strict_tx_hash == 'true' && '1' || '' }}
          GIT_COMMIT_HASH: ${{ github.sha }}
        run: |
          nix develop -c bash -c '
            cd rust
            cargo test --test mod devnet_indexer_matches_archive -- --ignored --nocapture
          '
