# Build the per-network configless mina-indexer OCI images (Nix, reproducible)
# and push them to the GitHub Container Registry: ghcr.io/<owner>/mina-indexer.
#
# Per-network configless images, single repo with a tag suffix:
#   tag v*  -> :<tag>-<network> and :latest-<network>   (mainnet | mesa-mut)
#   PRs     -> build only (no push)
# (devnet is a hardfork bring-up tracked separately.)
#
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no extra secrets.
name: OCI image

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  oci-image:
    # x86-64-linux is required to build the image (see README).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: mainnet
            attr: dockerImage-mainnet
          - network: mesa-mut
            attr: dockerImage-mesa
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE: mina-indexer
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Determine tag + push
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}-${{ matrix.network }}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.run_id }}-${{ matrix.network }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        run: skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"

      - name: Build (and push) the ${{ matrix.network }} OCI image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ATTR: ${{ matrix.attr }}
          DRY_RUN: ${{ steps.meta.outputs.push == 'true' && '0' || '1' }}
        run: ops/build-and-push-oci.sh

      - name: Also tag :latest-${{ matrix.network }} (on release tag)
        if: github.ref_type == 'tag'
        run: |
          skopeo copy \
            "docker://${REGISTRY}/${IMAGE}:${{ steps.meta.outputs.tag }}" \
            "docker://${REGISTRY}/${IMAGE}:latest-${{ matrix.network }}"
