# Run the Rust test suite on pull requests, in the project's Nix dev shell
# (the canonical build environment: clang + mold + libclang).
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run tests
        run: |
          export GIT_COMMIT_HASH="$(git rev-parse --short=8 HEAD || echo unknown)"
          nix develop --command bash -c 'cd rust && cargo nextest run --release'

  # Gate lint regressions and newly-disclosed dependency CVEs on PRs. The tooling
  # (clippy -Dwarnings + custom denies, and `cargo audit`) already lives in the
  # Rakefile; this just wires it into PR CI. See issue #36.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the format check can diff against the PR base

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Blocking: clippy -Dwarnings + the custom denies from `rake lint_rust`.
      - name: Clippy (deny warnings)
        run: |
          export GIT_COMMIT_HASH="$(git rev-parse --short=8 HEAD || echo unknown)"
          nix develop --command rake .build/cargo_clippy

      # Blocking, but only on the lines this PR changed: `rustfmt` must be clean
      # on touched code. Pre-existing drift elsewhere is ignored (no repo-wide
      # reformat). PR-only.
      - name: Format check (touched lines)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          FMT_BASE=FETCH_HEAD nix develop --command rake fmt_check

      # Blocking: fails the PR on any dependency advisory. cargo-audit is pinned
      # via the `nixpkgs-audit` flake input (0.22.x, parses CVSS-4.0 advisories);
      # `rake audit` ignores RUSTSEC-2026-0009 only (see the Rakefile for why).
      - name: cargo audit (advisory scan)
        run: nix develop --command rake audit

      # Blocking: license + source supply-chain gate (the checks cargo-audit
      # doesn't do). Fails the PR on a dependency license outside the allow-list
      # or an unapproved source. Config: rust/deny.toml.
      - name: cargo deny (license/source scan)
        run: nix develop --command rake deny

  # Self-contained end-to-end ledger-fidelity gate (#19 WS2): boot the indexer
  # against a small vendored slice of real mainnet post-hardfork blocks (embedded
  # genesis, nothing external needed) and assert every account balance matches the
  # accounts_accessed oracle in the source blocks. Exercises the full ingest ->
  # serve pipeline, catching ledger-correctness regressions (the class fixed in
  # #87/#88/#90) that unit tests alone would miss.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: E2E ledger fidelity gate
        run: |
          export GIT_COMMIT_HASH="$(git rev-parse --short=8 HEAD || echo unknown)"
          nix develop --command rake test_e2e
